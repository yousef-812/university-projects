name: Build XO Game Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'XO_Game_AI/**'
      - '.github/workflows/build-xo-windows.yml'

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        working-directory: XO_Game_AI
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name XO_AI_PEAS xo_game.py

      - name: Verify EXE
        working-directory: XO_Game_AI
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/XO_AI_PEAS.exe')) {
            Write-Error 'XO_AI_PEAS.exe was not created.'
            exit 1
          }
          Get-Item 'dist/XO_AI_PEAS.exe' | Select-Object Name, Length, FullName

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: XO_AI_PEAS-Windows
          path: XO_Game_AI/dist/XO_AI_PEAS.exe
          if-no-files-found: error
          retention-days: 30
